<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="0.55" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#D04BE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E1F7"/>
    </linearGradient>
    <linearGradient id="boxInside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A8F"/>
      <stop offset="1" stop-color="#5B45C9"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEBFA"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FC3FF"/><stop offset="1" stop-color="#2A7BFF"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5EF0A8"/><stop offset="1" stop-color="#16B876"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC46B"/><stop offset="1" stop-color="#FF7A3D"/></linearGradient>
    <linearGradient id="zip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E7CFF"/><stop offset="1" stop-color="#6A55F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1B0F5C" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B0F5C" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><path id="squircle" d="M330 100 H694 C882.6 100 924 141.4 924 330 V694 C924 882.6 882.6 924 694 924 H330 C141.4 924 100 882.6 100 694 V330 C100 141.4 141.4 100 330 100 Z"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#shadow)">
    <path d="M330 100 H694 C882.6 100 924 141.4 924 330 V694 C924 882.6 882.6 924 694 924 H330 C141.4 924 100 882.6 100 694 V330 C100 141.4 141.4 100 330 100 Z" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <circle cx="860" cy="880" r="260" fill="#ffffff" opacity="0.06"/>
    <circle cx="150" cy="820" r="180" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- box opening (back) -->
  <path d="M282 440 L742 440 L742 500 L282 500 Z" fill="url(#boxInside)"/>

  <!-- files popping out -->
  <g filter="url(#soft)">
    <g transform="rotate(-16 400 470)">
      <rect x="318" y="260" width="170" height="220" rx="26" fill="url(#c1)"/>
      <rect x="350" y="306" width="104" height="16" rx="8" fill="#fff" opacity="0.85"/>
      <rect x="350" y="338" width="78" height="16" rx="8" fill="#fff" opacity="0.6"/>
    </g>
    <g transform="rotate(14 624 470)">
      <rect x="536" y="262" width="170" height="220" rx="26" fill="url(#c3)"/>
      <rect x="568" y="308" width="104" height="16" rx="8" fill="#fff" opacity="0.85"/>
      <rect x="568" y="340" width="78" height="16" rx="8" fill="#fff" opacity="0.6"/>
    </g>
    <g>
      <rect x="427" y="214" width="170" height="250" rx="26" fill="url(#c2)"/>
      <rect x="459" y="260" width="106" height="16" rx="8" fill="#fff" opacity="0.9"/>
      <rect x="459" y="292" width="80" height="16" rx="8" fill="#fff" opacity="0.65"/>
      <rect x="459" y="324" width="96" height="16" rx="8" fill="#fff" opacity="0.65"/>
    </g>
  </g>

  <!-- box front -->
  <g filter="url(#shadow)">
    <path d="M262 470 H762 V700 Q762 790 672 790 H352 Q262 790 262 700 Z" fill="url(#boxFront)"/>
  </g>
  <!-- lid rim -->
  <g filter="url(#soft)">
    <rect x="236" y="432" width="552" height="86" rx="30" fill="url(#lid)"/>
  </g>
  <rect x="236" y="500" width="552" height="18" rx="9" fill="#D9D4F5" opacity="0.7"/>

  <!-- zipper -->
  <rect x="482" y="518" width="60" height="230" rx="12" fill="url(#zip)" opacity="0.18"/>
  <g fill="#7B66F5">
    <rect x="492" y="532" width="18" height="12" rx="4"/><rect x="514" y="550" width="18" height="12" rx="4"/>
    <rect x="492" y="568" width="18" height="12" rx="4"/><rect x="514" y="586" width="18" height="12" rx="4"/>
    <rect x="492" y="604" width="18" height="12" rx="4"/><rect x="514" y="622" width="18" height="12" rx="4"/>
    <rect x="492" y="640" width="18" height="12" rx="4"/><rect x="514" y="658" width="18" height="12" rx="4"/>
  </g>
  <!-- zipper pull -->
  <g>
    <rect x="478" y="672" width="68" height="40" rx="14" fill="url(#zip)"/>
    <rect x="490" y="700" width="44" height="66" rx="18" fill="url(#zip)"/>
    <rect x="503" y="716" width="18" height="34" rx="9" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>

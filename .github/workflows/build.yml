name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Swift version
        run: swift --version
      - name: Build everything
        run: swift build
      - name: Run tests
        run: swift test
      - name: Build Unrar.app (universal)
        run: scripts/build-app.sh
      - name: Screenshots
        continue-on-error: true
        run: scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screenshots/*.png
      - name: Package
        run: ditto -c -k --keepParent build/Unrar.app build/Unrar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Unrar-app
          path: build/Unrar.zip

  linux:
    name: ArchiveKit on Linux
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

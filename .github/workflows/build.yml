name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Swift version
        run: swift --version
      - name: Build everything
        run: swift build
      - name: Run tests
        run: swift test
      - name: Build Unrar.app (universal)
        run: scripts/build-app.sh
      - name: Screenshots
        continue-on-error: true
        run: scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screenshots/*.png
      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          set -e
          dir=$(mktemp -d)
          cp build/screenshots/*.png "$dir/"
          cd "$dir"
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - name: Package
        run: ditto -c -k --keepParent build/Unrar.app build/Unrar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Unrar-app
          path: build/Unrar.zip

  linux:
    name: ArchiveKit on Linux
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
